e a licence key by email. Paste it here. It is checked on this device; nothing is sent anywhere.","Al contratar un plan recibes una clave de licencia por correo. Pégala aquí. Se comprueba en este dispositivo; no se envía nada."],["Test mode","Modo de prueba"],["This is a test build. Switch plan freely to see what each tier includes. No payment is taken and no licence is needed.","Esta es una versión de prueba. Cambia de plan libremente para ver qué incluye cada nivel. No se cobra nada ni hace falta licencia."],["Back to my trial","Volver a mi prueba"],["Simulate: trial ended","Simular: prueba terminada"],["Plans","Planes"],["To be told when payments open, write to","Para que te avisemos cuando se abran los pagos, escribe a"],["Account","Cuenta"],["Created","Creada"],["stored in this browser only","guardada solo en este navegador"],["Sign out","Cerrar sesión"],["Delete my account and all data","Eliminar mi cuenta y todos los datos"],["The weekly routine","La rutina semanal"],["\u003cb>Import\u003c/b> the latest CSV from your invoicing tool. Invoices already imported are skipped.","\u003cb>Importa\u003c/b> el último CSV de tu programa de facturación. Las facturas ya importadas se omiten."],["\u003cb>Mark as paid\u003c/b> what has come in: open the invoice and set the payment date.","\u003cb>Marca como pagado\u003c/b> lo que ha entrado: abre la factura e indica la fecha de pago."],["\u003cb>Approve\u003c/b> the drafts in Approvals, then send each one from your own mailbox.","\u003cb>Aprueba\u003c/b> los borradores en Aprobaciones y envía cada uno desde tu propio buzón."],["\u003cb>Record\u003c/b> any promised date or dispute so reminders pause when they should.","\u003cb>Registra\u003c/b> cualquier fecha prometida o disputa para que los recordatorios se pausen cuando toca."],["\u003cb>Back up\u003c/b>: Settings → Export this workspace.","\u003cb>Haz copia\u003c/b>: Ajustes → Exportar este espacio."],["Which columns does the CSV need?","¿Qué columnas necesita el CSV?"],["Invoice number, customer, amount and due date. Email, issue date, currency and language are optional. Download a sample from Import.","Número de factura, cliente, importe y vencimiento. Correo, fecha de emisión, moneda e idioma son opcionales. Descarga un ejemplo desde Importar."],["Why is there no reminder for an invoice?","¿Por qué no hay recordatorio para una factura?"],["Open the invoice: it shows the reason. Usually it is not yet due for the next step, a promise is pending, it is disputed or paused, there is no email, or it is the weekend.","Abre la factura: muestra el motivo. Normalmente aún no toca el siguiente paso, hay una promesa pendiente, está en disputa o en pausa, no hay correo o es fin de semana."],["Why can I not approve a draft I edited?","¿Por qué no puedo aprobar un borrador que he editado?"],["The invoice number, amount and due date must stay exactly as in your data, and the text may not mention legal action, interest or similar. Reset the draft to start again.","El número de factura, el importe y el vencimiento deben quedar exactamente como en tus datos, y el texto no puede mencionar acciones legales, intereses o similares. Restablece el borrador para empezar de nuevo."],["How do I move to another computer?","¿Cómo paso a otro ordenador?"],["Settings → Export this workspace (JSON). On the other computer, create your account with the same email, then Settings → Restore a backup. Enter your licence key again under Plan & account.","Ajustes → Exportar este espacio (JSON). En el otro ordenador, crea tu cuenta con el mismo correo y ve a Ajustes → Restaurar una copia. Vuelve a introducir tu clave de licencia en Plan y cuenta."],["What happens if I clear my browser data?","¿Qué pasa si borro los datos del navegador?"],["Your invoices and history are deleted with it. Keep a recent export.","Tus facturas y tu historial se borran con ellos. Conserva una exportación reciente."],["Support","Soporte"],["Write to","Escribe a"],["We answer within two working days.","Respondemos en dos días laborables."],["Restore a backup","Restaurar una copia"],["Choose a workspace file exported from this app (JSON). It is added to an empty workspace or as a new one if your plan allows.","Elige un archivo de espacio exportado desde esta aplicación (JSON). Se añade a un espacio vacío o como espacio nuevo si tu plan lo permite."],["Backup file","Archivo de copia"],["Reminders follow the standard schedule on your plan. Your own timing and tone are part of Growth.","Los recordatorios siguen el calendario estándar en tu plan. Los plazos y el tono a medida forman parte de Growth."],["That file is not a workspace backup.","Ese archivo no es una copia de un espacio."],["Your plan allows one workspace and it already has invoices. Export and delete it first, or move to the Firm plan.","Tu plan permite un espacio y ya contiene facturas. Expórtalo y elimínalo primero, o pasa al plan Firm."],["Choose a plan to make changes. You can still view and export your data.","Elige un plan para hacer cambios. Puedes seguir viendo y exportando tus datos."],["Your plan includes one workspace. Client workspaces are part of the Firm plan.","Tu plan incluye un espacio. Los espacios por cliente forman parte del plan Firm."],["Enter your name and your business name.","Indica tu nombre y el de tu empresa."],["Enter a valid work email.","Indica un correo de trabajo válido."],["Pick a plan to try.","Elige un plan para probar."],["This product is for invoices owed by businesses. Please confirm.","Este producto es para facturas debidas por empresas. Confírmalo, por favor."],["Please accept the Terms and the Privacy notice.","Acepta las Condiciones y la Política de privacidad, por favor."],["Fill in your name and your firm or business.","Indica tu nombre y tu despacho o empresa."],["The pilot is for invoices owed by businesses. Please confirm.","El piloto es para facturas debidas por empresas. Confírmalo, por favor."],["Tick the last box so that we may contact you about the pilot.","Marca la última casilla para que podamos contactarte sobre el piloto."],["Name","Nombre"],["Email","Correo"],["Accounting firm","Gestoría o asesoría"],["Small service business","Pequeña empresa de servicios"],["Client businesses or invoices a month","Empresas cliente o facturas al mes"],["Invoicing or accounting tool","Programa de facturación o contabilidad"],["What takes most time","Qué lleva más tiempo"],["yes","sí"],["May be contacted about the pilot","Acepta contacto sobre el piloto"],["Date","Fecha"],["Click again to delete the account and every workspace","Pulsa otra vez para eliminar la cuenta y todos los espacios"],["Report copied.","Informe copiado."],["File too large.","Archivo demasiado grande."],["That email address does not look right. Nothing was changed.","Esa dirección de correo no parece correcta. No se ha cambiado nada."],["Overdue","Vencida"],["Due soon","Vence pronto"],["Disputed","En disputa"],["Paused","En pausa"],["Paid","Pagada"],["Open","Abierta"],["Follow-up is paused","El seguimiento está en pausa"],["In dispute: reminders stop until it is resolved","En disputa: los recordatorios se detienen hasta resolverla"],["A payment promise is pending","Hay una promesa de pago pendiente"],["No contact email on file","No hay correo de contacto"],["Not yet at the next reminder date","Aún no toca el siguiente recordatorio"],["Too soon after the last reminder","Demasiado pronto tras el último recordatorio"],["All reminders in the sequence were sent: decide the next step yourself","Se enviaron todos los recordatorios de la secuencia: decide tú el siguiente paso"],["Missing invoice number","Falta el número de factura"],["Missing customer","Falta el cliente"],["Invoice number is longer than 60 characters","El número de factura tiene más de 60 caracteres"],["Customer name is longer than 160 characters","El nombre del cliente tiene más de 160 caracteres"],["Amount is missing or not above zero","Importe ausente o no superior a cero"],["Due date missing or not a real date","Vencimiento ausente o fecha no válida"],["Duplicate invoice number in this file","Número de factura duplicado en el archivo"],["Already imported","Ya importada"],["No email: no reminders can be drafted","Sin correo: no se podrán redactar recordatorios"],["Email looks wrong and was left empty","El correo parece incorrecto y se dejó vacío"],["Issue date not understood","Fecha de emisión no reconocida"],["Issue date is after the due date","La emisión es posterior al vencimiento"],["Import","Importación"],["Reminder approved","Recordatorio aprobado"],["Draft skipped","Borrador omitido"],["Draft edited","Borrador editado"],["Promise recorded","Promesa registrada"],["Marked as paid","Marcada como pagada"],["Dispute opened","Disputa abierta"],["Dispute resolved","Disputa resuelta"],["Follow-up paused","Seguimiento en pausa"],["Follow-up resumed","Seguimiento reanudado"],["Rules changed","Reglas modificadas"],["Data exported","Datos exportados"],["Demo data loaded","Datos demo cargados"],["Workspace created","Espacio creado"],["Backup restored","Copia restaurada"],["Customer settings changed","Ajustes de cliente modificados"],["Promises & disputes","Promesas y disputas"],["Customers","Clientes"],["Audit log","Registro"],["Settings","Ajustes"],["Plan & account","Plan y cuenta"],["Help","Ayuda"],["Invoice number","Nº de factura"],["Issue date","Fecha de emisión"],["Currency","Moneda"],["13-week expected cash","Caja esperada a 13 semanas"],["Custom follow-up rules and customer settings","Reglas de seguimiento a medida y ajustes por cliente"],["Audit log export (CSV)","Exportación del registro (CSV)"],["Monthly review report","Informe de revisión mensual"],["Guided set-up and monthly review call","Puesta en marcha guiada y revisión mensual"],["Client workspaces and firm overview","Espacios por cliente y vista de despacho"],["For freelancers and very small teams","Para autónomos y equipos muy pequeños"],["Up to 25 open invoices","Hasta 25 facturas abiertas"],["Reminder drafts that you approve, in the language of each customer","Borradores de recordatorio que tú apruebas, en el idioma de cada cliente"],["Receivables view with clear statuses","Vista de cobros con estados claros"],["Audit log, full data export and backups","Registro de acciones, exportación completa y copias"],["For businesses that invoice every week","Para empresas que facturan cada semana"],["Up to 100 open invoices","Hasta 100 facturas abiertas"],["Everything in Starter","Todo lo de Starter"],["Promises and disputes ledger","Registro de promesas y disputas"],["13-week expected-cash view","Vista de caja esperada a 13 semanas"],["Your own follow-up rules, customer settings and audit export","Tus propias reglas, ajustes por cliente y exportación del registro"],["For teams that want a person alongside","Para equipos que quieren acompañamiento"],["Everything in Growth","Todo lo de Growth"],["Guided set-up session","Sesión de puesta en marcha guiada"],["Monthly review call","Llamada de revisión mensual"],["For accounting firms and advisers","Para gestorías y asesorías"],["Up to 10 client workspaces","Hasta 10 espacios de cliente"],["Up to 100 open invoices per client","Hasta 100 facturas abiertas por cliente"],["Everything in Growth for every client","Todo lo de Growth para cada cliente"],["Firm overview across all clients","Vista de despacho de todos los clientes"],["Workspaces","Espacios"],["CSV import with checks","Importación CSV con comprobaciones"],["Reminder drafts with approval, in many languages","Recordatorios con aprobación, en muchos idiomas"],["Audit log, full data export and backups","Registro, exportación completa y copias"],["Does it send messages on its own?","¿Envía mensajes por su cuenta?"],["No. Every reminder is approved by you. After you approve, you send it from your own mailbox with one click, so your customer sees a message from you.","No. Tú apruebas cada recordatorio. Después lo envías desde tu propio buzón con un clic, así tu cliente ve un mensaje tuyo."],["Where is my data?","¿Dónde están mis datos?"],["In your browser, on your device. Nothing is uploaded to a server. Export a backup whenever you like and restore it on another device.","En tu navegador, en tu dispositivo. No se sube nada a un servidor. Exporta una copia cuando quieras y restáurala en otro dispositivo."],["Do you connect to my bank?","¿Os conectáis a mi banco?"],["No. You import invoices from a CSV file and mark them as paid yourself. No money flows through the product.","No. Importas las facturas desde un CSV y las marcas como pagadas tú. Ningún dinero pasa por el producto."],["Is this a credit check on my customers?","¿Es un análisis de crédito de mis clientes?"],["No. The expected-cash view uses only your own invoices and the payment history you have observed with each customer.","No. La vista de caja esperada usa solo tus propias facturas y el historial de pago que has observado con cada cliente."],["Does it use AI?","¿Usa IA?"],["This version drafts reminders from fixed templates and rules, so amounts, dates and invoice numbers always come from your data. AI-assisted drafting is planned and will stay under your approval.","Esta versión redacta los recordatorios con plantillas y reglas fijas, así los importes, las fechas y los números siempre salen de tus datos. La redacción asistida por IA está prevista y seguirá bajo tu aprobación."],["What happens when the trial ends?","¿Qué pasa cuando termina la prueba?"],["Your data stays on your device and you can still view and export it. To keep importing and approving, choose a plan.","Tus datos siguen en tu dispositivo y puedes verlos y exportarlos. Para seguir importando y aprobando, elige un plan."],["Does the pilot cost anything?","¿El piloto cuesta algo?"],["No. There is no payment and no card. The pilot is unpaid on both sides.","No. No hay pago ni tarjeta. El piloto no se cobra por ninguna de las dos partes."],["Do I have to buy afterwards?","¿Tengo que comprar después?"],["No. Prices are not final and your feedback will help set them. When paid plans open we will tell you first, and you decide.","No. Los precios no son definitivos y tu opinión ayudará a fijarlos. Cuando abran los planes de pago te avisaremos antes, y tú decides."],["In your browser, on your own computer. Nothing is uploaded to a server and we cannot see it. Export a backup whenever you like.","En tu navegador, en tu propio ordenador. No se sube nada a un servidor y no podemos verlo. Exporta una copia cuando quieras."],["No. Every reminder is approved by you. After you approve, you send it from your own mailbox, so your customer sees a message from you.","No. Tú apruebas cada recordatorio. Después lo envías desde tu propio buzón, así tu cliente ve un mensaje tuyo."],["Is this debt collection?","¿Es un servicio de recobro?"],["No. It organises your own follow-up of your own invoices to other businesses. It sends no legal notices, calculates no interest and makes no threats.","No. Organiza tu propio seguimiento de tus facturas a otras empresas. No envía requerimientos legales, no calcula intereses y no amenaza."],["How long does my access last?","¿Cuánto dura mi acceso?"],["This version drafts reminders from fixed templates and rules, so amounts, dates and invoice numbers always come from your data.","Esta versión redacta los recordatorios con plantillas y reglas fijas, así los importes, las fechas y los números siempre salen de tus datos."],["An accounting firm: client workspaces and firm overview","Una gestoría: espacios de cliente y vista de despacho"],["A small service business: one workspace","Una pequeña empresa de servicios: un espacio"],["Record the date a customer promises to pay and mark disputes. Reminders pause while a promise is pending or a dispute is open.","Registra la fecha en que un cliente promete pagar y marca las disputas. Los recordatorios se pausan mientras haya una promesa pendiente o una disputa abierta."],["See the cash you can expect over the next 13 weeks, with the reason behind every number.","Ve la caja que puedes esperar en las próximas 13 semanas, con el motivo de cada cifra."],["Download the full audit log as a CSV file for your records or your adviser.","Descarga el registro completo en CSV para tus archivos o tu asesor."],["A one-page monthly review: what is open, what moved, which promises were kept and where to focus next.","Una revisión mensual en una página: qué está abierto, qué se movió, qué promesas se cumplieron y dónde centrarse."],["Keep a separate workspace for each client business and see totals across all of them.","Mantén un espacio separado para cada empresa cliente y ve los totales de todas."],["Set your own timing and tone for each reminder, see how each customer actually pays you, set their contact and language, and pause follow-up for a whole customer.","Define tus propios plazos y tono para cada recordatorio, ve cómo te paga realmente cada cliente, define su contacto e idioma y pausa el seguimiento de un cliente entero."],["That does not look like a licence key.","Eso no parece una clave de licencia."],["This build has no licence key configured.","Esta versión no tiene clave de licencias configurada."],["The key is not valid.","La clave no es válida."],["The key was issued for a different email address.","La clave se emitió para otra dirección de correo."],["The key has expired.","La clave ha caducado."],["The key names an unknown plan.","La clave indica un plan desconocido."],["This browser cannot check licence keys.","Este navegador no puede comprobar claves de licencia."],["The legal texts are available in English and Spanish only.","Los textos legales solo están disponibles en inglés y español."],["Automatic translation, not yet reviewed by a native speaker. The English and Spanish versions are the reference.","Traducción automática, aún no revisada por un hablante nativo. Las versiones en inglés y español son la referencia."],["Drafted from an automatically translated template. Read it carefully before you approve.","Redactado con una plantilla traducida automáticamente. Léelo con atención antes de aprobar."],["Which language are reminders written in?","¿En qué idioma se redactan los recordatorios?"],["In the language set for each customer under Customers, or in the Language column of your CSV. Without either, in the language you use the app in. The English and Spanish templates were written by hand; the others are automatic translations, so read them before you approve.","En el idioma definido para cada cliente en Clientes, o en la columna Idioma de tu CSV. Si no hay ninguno, en el idioma en que usas la aplicación. Las plantillas en español e inglés se escribieron a mano; las demás son traducciones automáticas, así que léelas antes de aprobar."],["Everything is stored in this browser only.","Todo se guarda solo en este navegador."],["Everything is stored in this browser only — and this browser is blocking storage, so data will be lost when you close the page. Export it.","Todo se guarda solo en este navegador — y este navegador bloquea el almacenamiento: los datos se perderán al cerrar la página. Expórtalos."],["Issue and correct invoices","Emite y corrige facturas"],["Test mode for now. ","De momento, en modo de prueba. "],["Create an invoice in one form and issue it: it joins your follow-up at once. Changes go through a corrective invoice, as the law requires.","Crea una factura en un solo formulario y emítela: entra en el seguimiento al momento. Los cambios se hacen con una factura rectificativa, como exige la ley."],["Add one invoice by hand","Añadir una factura a mano"],["For invoices you issued elsewhere. Fields with * are required.","Para facturas emitidas en otro programa. Los campos con * son obligatorios."],["Add invoice","Añadir factura"],["Test mode: invoices issued in this version are for trying the feature and are not valid invoices. Valid invoicing in Spain needs a system that meets the VERI*FACTU rules; this switches on once that work is finished.","Modo de prueba: las facturas emitidas en esta versión sirven para probar la función y no son facturas válidas. Facturar de forma válida en España exige un sistema que cumpla las normas VERI*FACTU; se activará cuando ese trabajo esté terminado."],["Delete draft","Eliminar borrador"],["View and print","Ver e imprimir"],["Change","Modificar"],["Cancel invoice","Anular factura"],["Create, issue and correct your invoices here. Issued invoices go straight into follow-up.","Crea, emite y corrige tus facturas aquí. Las facturas emitidas pasan directamente al seguimiento."],["New invoice","Nueva factura"],["Number","Número"],["Total","Total"],["Corrects","Rectifica"],["No invoices yet. Create your first one.","Aún no hay facturas. Crea la primera."],["Subtotal","Base imponible"],["Tax","Impuesto"],["The law does not allow editing an issued invoice. A corrective invoice is issued that replaces it, and the follow-up moves to the new number.","La ley no permite editar una factura emitida. Se emite una factura rectificativa que la sustituye y el seguimiento pasa al nuevo número."],["A corrective invoice for the full amount is issued and the invoice leaves follow-up.","Se emite una factura rectificativa por el importe total y la factura sale del seguimiento."],["Once issued, an invoice cannot be edited. To change it later, you issue a correction.","Una vez emitida, la factura no se puede editar. Para cambiarla después, se emite una rectificativa."],["What changes and why? *","¿Qué cambia y por qué? *"],["Your business details (printed on every invoice)","Datos de tu empresa (aparecen en cada factura)"],["Tax ID","NIF"],["Address","Dirección"],["Bank account (IBAN) for payment","Cuenta bancaria (IBAN) para el pago"],["Description","Concepto"],["Qty","Cant."],["Unit price","Precio unitario"],["Remove","Quitar"],["Customer tax ID","NIF del cliente"],["Customer address","Dirección del cliente"],["Tax %","IVA %"],["Add line","Añadir línea"],["Notes (optional)","Notas (opcional)"],["Issue correction","Emitir rectificativa"],["Issue invoice","Emitir factura"],["Save draft","Guardar borrador"],["Print or save as PDF","Imprimir o guardar como PDF"],["TEST: not a valid invoice","PRUEBA: no es una factura válida"],["Corrective invoice","Factura rectificativa"],["Corrects invoice","Rectifica la factura"],["Reason","Motivo"],["Pay by bank transfer to","Pago por transferencia a"],["Add at least one line with a description and a price.","Añade al menos una línea con concepto y precio."],["That email address does not look right.","Esa dirección de correo no parece correcta."],["The due date cannot be before the issue date.","El vencimiento no puede ser anterior a la fecha de emisión."],["Fill in the fields marked *.","Rellena los campos marcados con *."],["Write the reason first.","Escribe primero el motivo."],["Invoice cancelled.","Factura anulada."],["Click again to delete","Pulsa otra vez para eliminar"],["Draft saved.","Borrador guardado."],["Invoice draft saved","Borrador de factura guardado"],["Invoice issued","Factura emitida"],["Corrective invoice issued","Rectificativa emitida"],["Invoice cancelled","Factura anulada"],["Invoice added by hand","Factura añadida a mano"],["Draft","Borrador"],["Issued","Emitida"],["Corrected","Rectificada"],["Cancelled","Anulada"],["Correction","Rectificativa"],["Invoicing","Facturación"],["Automatic status from replies","Estado automático según las respuestas"],["Statuses that update from what your customers reply.","Estados que se actualizan con lo que responden tus clientes."],["Paste a reply and ClearlyDue reads it: paid, promised for Friday, disputed. Clear cases update on their own if you want them to, everything else is a suggestion, and you can switch it off at any time.","Pega una respuesta y ClearlyDue la lee: pagada, prometida para el viernes, en disputa. Los casos claros se actualizan solos si así lo quieres, el resto queda como sugerencia, y puedes desactivarlo cuando quieras."],["Hi, we will pay invoice INV-2026-041 on Friday. Thanks!","Hola, pagaremos la factura INV-2026-041 el viernes. ¡Gracias!"],["Updated automatically:","Actualizado automáticamente:"],["Undo","Deshacer"],["Part payment mentioned: check the amount before marking it as paid.","Menciona un pago parcial: revisa el importe antes de marcarla como pagada."],["Asks for a copy of the invoice.","Pide una copia de la factura."],["Says this is the wrong contact.","Dice que no es el contacto correcto."],["Nothing clear in this reply. No change made.","Esta respuesta no deja nada claro. No se ha cambiado nada."],["Words found","Palabras detectadas"],["No date given: record the promise with a date.","Sin fecha: registra la promesa con una fecha."],["Apply","Aplicar"],["Suggested:","Sugerencia:"],["Customer reply","Respuesta del cliente"],["Paste what the customer wrote (email, WhatsApp or call notes).","Pega lo que escribió el cliente (correo, WhatsApp o notas de una llamada)."],["On","Activado"],["Off","Desactivado"],["Read reply","Leer respuesta"],["No matching open invoice","Ninguna factura pendiente coincide"],["When this is on, clear replies change the status straight away: paid, promised with a date, or disputed. Anything less clear is only suggested. Replies are read by keyword rules on this device, nothing is sent anywhere, and every change is logged and can be undone.","Con esta opción activada, las respuestas claras cambian el estado al momento: pagada, con promesa y fecha, o en disputa. Lo que no está claro solo se sugiere. Las respuestas se leen con reglas de palabras clave en este dispositivo, no se envía nada a ningún sitio, y cada cambio queda registrado y se puede deshacer."],["Reads replies in","Lee respuestas en"],["Paste customer replies","Pega las respuestas de los clientes"],["Paste one or more replies, separated by a line with three dashes (---). Each one is matched to an open invoice by invoice number, customer email or customer name.","Pega una o varias respuestas, separadas por una línea con tres guiones (---). Cada una se asocia a una factura pendiente por número de factura, correo o nombre del cliente."],["Read replies","Leer respuestas"],["Recent changes from replies","Cambios recientes por respuestas"],["Undone","Deshecho"],["Paste a reply first.","Pega primero una respuesta."],["Change undone.","Cambio deshecho."],["Status changed from a reply (automatic)","Estado cambiado por una respuesta (automático)"],["Status changed from a reply","Estado cambiado por una respuesta"],["Change from a reply undone","Cambio por respuesta deshecho"],["Automatic status turned on","Estado automático activado"],["Automatic status turned off","Estado automático desactivado"],["Replies","Respuestas"],["Automatic status from customer replies, which you can switch off","Estado automático según las respuestas de los clientes, que puedes desactivar"]],"patterns":[["{0} days from the day you start: the four-week pilot plus time to set up and wrap up. Afterwards your data stays on your device and you can still view and export it. We can extend access with a key at no cost."],["{0} languages"],["in {0} languages"],["{0} turns your open invoices into a calm follow-up routine that you approve, plus a clear 13-week view of the cash you can expect."],["What {0} does not do."],["We are inviting a small group of accounting firms and small service businesses in Spain to use the full {0} product on their own business invoices for four weeks, free of charge, and to tell us what to fix before launch."],["I agree that {0} uses these details to contact me about the pilot."],["{0} paid invoices, on average {1} days after the due date"],["Reminder {0} ({1}) is waiting in Approvals."],["{0} has no history and uses a 14-day rule of thumb."],["{0} invoice imported."],["{0} invoices imported."],["{0} not imported: your plan includes up to {1} open invoices."],["Prices exclude VAT. {0}-day free trial of the plan you pick, no card needed. Cancel any time."],["{0} days free · no card · your invoice data stays in your browser"],["{0} days of access. No payment, no card. Start once we have agreed your pilot by email."],["{0} days, no card. It takes one minute."],["pilot, {0} day left"],["pilot, {0} days left"],["trial, {0} day left"],["trial, {0} days left"],["{0} reminder is waiting for your approval."],["{0} reminders are waiting for your approval."],["Your plan includes up to {0} open invoices. This workspace has {1}."],["of {0} in your plan"],["{0} paid, on average {1} days after due"],["Pilot access to {0}: {1} day left (until {2})."],["Pilot access to {0}: {1} days left (until {2})."],["Free trial of {0}: {1} day left (until {2})."],["Free trial of {0}: {1} days left (until {2})."],["{0}, active until {1}."],["{0} (test mode: no payment, no licence)."],["This backup has more open invoices than your plan allows ({0})."],["Backup restored: {0} invoices."],["{0} is included in {1}."],["Your plan includes up to {0} client workspaces."],["Welcome, {0}. Start by importing your open invoices, or load the demo data from Settings."],["{0} pilot application"],["Licence active: {0} until {1}."],["Correct invoice {0}"],["Cancel invoice {0}"],["Your plan includes up to {0} open invoices. Mark paid invoices as paid, or move to a larger plan."],["Invoice {0} issued and added to follow-up."],["Correction {0} issued. Follow-up continues under the new number."],["Invoice {0} added. Add another or go to Receivables."],["{0} replies read, {1} invoices updated automatically."]]}</script>
<script type="application/json" id="i18n-tpl">{"ca":{"subject":"Factura {number} · recordatori de pagament","friendly":"Bon dia,\n\nUna nota breu per fer-vos saber que la factura {number}, d’import {amount} i amb venciment el {due}, encara consta com a oberta per part nostra. Ens podríeu indicar quan podem esperar el pagament?\n\nSi ja està en camí, moltes gràcies i oblideu aquest missatge.\n\nCordialment,\n{sender}","neutral":"Bon dia,\n\nEns posem en contacte amb vosaltres per la factura {number}, d’import {amount}, que va vencer el {due} i que fa {days} dies que ha passat el venciment. Ens podríeu confirmar la data de pagament o dir-nos si falta alguna cosa per part nostra?\n\nCordialment,\n{sender}","firm":"Bon dia,\n\nLa factura {number}, d’import {amount}, va vencer el {due} i continua pendent després dels nostres recordatoris anteriors. Us demanem que ens confirmeu una data de pagament aquesta setmana, o que respongueu a aquest missatge si hi ha algun problema amb la factura, per poder resoldre’l.\n\nCordialment,\n{sender}","banned":["acció legal","accions legals","advocat","tribunal","jutjat","demanda judicial","interessos de demora","penalització","recobrament","llista de morosos","llista negra","reclamació judicial","burofax"]},"gl":{"subject":"Factura {number} · recordatorio de pagamento","friendly":"Bo día,\n\nUnha nota breve para facervos saber que a factura {number}, de {amount} e con vencemento o {due}, aínda figura como aberta pola nosa banda. Poderiades indicarnos cando podemos esperar o pagamento?\n\nSe xa está en camiño, moitas grazas e ignorade esta mensaxe.\n\nCordialmente,\n{sender}","neutral":"Bo día,\n\nPonémonos en contacto con vós pola factura {number}, de {amount}, que venceu o {due} e leva {days} días de atraso sobre o vencemento. Poderiades confirmarnos a data de pagamento ou dicirnos se falta algo pola nosa banda?\n\nCordialmente,\n{sender}","firm":"Bo día,\n\nA factura {number}, de {amount}, venceu o {due} e segue pendente despois dos nosos recordatorios anteriores. Pedímosvos que nos confirmedes unha data de pagamento esta semana, ou que respondades a esta mensaxe se hai algún problema coa factura, para poder resolvelo.\n\nCordialmente,\n{sender}","banned":["acción legal","accións legais","avogado","tribunal","xulgado","demanda xudicial","xuros de mora","penalización","recobro","lista de morosos","lista negra","reclamación xudicial","burofax"]},"eu":{"subject":"{number} faktura · ordainketa-oroigarria","friendly":"Kaixo:\n\nOhar labur bat: {number} faktura (zenbatekoa: {amount}; muga-eguna: {due}) ordaindu gabe ageri da oraindik gure kontuetan. Esango zeniguke noiz egingo den ordainketa?\n\nOrdainketa bidean badago, eskerrik asko, eta ez egin kasurik mezu honi.\n\nAdeitasunez,\n{sender}","neutral":"Kaixo:\n\n{number} fakturaren jarraipena egiten ari gara (zenbatekoa: {amount}). Muga-eguna {due} izan zen, eta {days} egun igaro dira ordutik. Berretsiko zeniguke ordainketa-data, edo esango zeniguke gure aldetik zerbait falta den?\n\nAdeitasunez,\n{sender}","firm":"Kaixo:\n\n{number} faktura (zenbatekoa: {amount}; muga-eguna: {due}) ordaindu gabe dago oraindik, aurreko oroigarriak bidali ondoren. Mesedez, berretsi ordainketa-data bat aste honetan, edo erantzun mezu honi fakturarekin arazoren bat badago, konpon dezagun.\n\nAdeitasunez,\n{sender}","banned":["lege-ekintza","neurri judizial","abokatu","epaitegi","auzitegi","demanda","berandutze-interes","isun","zigor","zor-bilketa","zor-kobrantza","kobrantza-agentzia","kreditu-erregistro","zerrenda beltz","salaketa"]},"pt-PT":{"subject":"Fatura {number} · lembrete de pagamento","friendly":"Bom dia,\n\nUma nota rápida: a fatura {number}, no valor de {amount}, com vencimento em {due}, continua em aberto do nosso lado. Poderia indicar-nos quando podemos contar com o pagamento?\n\nSe já estiver a caminho, agradecemos e pedimos que ignore esta mensagem.\n\nCom os melhores cumprimentos,\n{sender}","neutral":"Bom dia,\n\nEstamos a acompanhar a fatura {number}, no valor de {amount}, que venceu em {due} e se encontra há {days} dias para além do vencimento. Poderia confirmar a data de pagamento ou indicar-nos se falta algum elemento do nosso lado?\n\nCom os melhores cumprimentos,\n{sender}","firm":"Bom dia,\n\nA fatura {number}, no valor de {amount}, venceu em {due} e continua por pagar após os nossos lembretes anteriores. Pedimos que confirme uma data de pagamento esta semana ou responda a esta mensagem caso exista algum problema com a fatura, para que o possamos resolver.\n\nCom os melhores cumprimentos,\n{sender}","banned":["ação judicial","processo judicial","advogado","tribunal","justiça","juros de mora","coima","penalização","execução fiscal","lista negra","cobrança coerciva","injunção","incumpridor"]},"pt-BR":{"subject":"Fatura {number} · lembrete de pagamento","friendly":"Olá,\n\nUm aviso rápido: a fatura {number}, no valor de {amount}, com vencimento em {due}, continua em aberto aqui do nosso lado. Você poderia nos informar quando podemos esperar o pagamento?\n\nSe ele já estiver a caminho, agradecemos e pedimos que desconsidere esta mensagem.\n\nAtenciosamente,\n{sender}","neutral":"Olá,\n\nEstamos acompanhando a fatura {number}, no valor de {amount}, que venceu em {due} e está há {days} dias além do vencimento. Você poderia confirmar a data do pagamento ou nos dizer se falta alguma informação do nosso lado?\n\nAtenciosamente,\n{sender}","firm":"Olá,\n\nA fatura {number}, no valor de {amount}, venceu em {due} e continua em aberto após os nossos lembretes anteriores. Pedimos que confirme uma data de pagamento nesta semana ou responda a esta mensagem caso haja algum problema com a fatura, para que possamos resolvê-lo.\n\nAtenciosamente,\n{sender}","banned":["ação judicial","processo judicial","advogado","tribunal","justiça","juros de mora","multa","protesto","negativação","serasa","cobrança judicial","lista negra","inadimplente"]},"fr":{"subject":"Facture {number} · relance de paiement","friendly":"Bonjour,\n\nPetit message pour vous signaler que la facture {number} d’un montant de {amount}, échue le {due}, figure toujours comme ouverte de notre côté. Pourriez-vous nous indiquer quand le paiement est prévu ?\n\nSi le règlement est déjà en cours, merci et veuillez ne pas tenir compte de ce message.\n\nCordialement,\n{sender}","neutral":"Bonjour,\n\nNous revenons vers vous au sujet de la facture {number} d’un montant de {amount}, échue le {due} et dont l’échéance est dépassée de {days} jours. Pourriez-vous nous confirmer la date de paiement, ou nous dire s’il manque un élément de notre côté ?\n\nCordialement,\n{sender}","firm":"Bonjour,\n\nLa facture {number} d’un montant de {amount}, échue le {due}, reste impayée malgré nos précédentes relances. Merci de nous confirmer une date de paiement cette semaine, ou de répondre à ce message s’il y a un problème avec la facture, afin que nous puissions le résoudre.\n\nCordialement,\n{sender}","banned":["action en justice","avocat","tribunal","huissier","mise en demeure","intérêts de retard","pénalités","recouvrement","contentieux","poursuites","liste noire","fichage"]},"de":{"subject":"Rechnung {number} · Zahlungserinnerung","friendly":"Guten Tag,\n\nkurze Nachricht zur Rechnung {number} über {amount}, fällig am {due}: Sie ist bei uns noch als offen verbucht. Könnten Sie uns mitteilen, bis wann wir mit der Zahlung rechnen können?\n\nSollte die Zahlung bereits unterwegs sein, vielen Dank, und bitte betrachten Sie diese Nachricht als gegenstandslos.\n\nFreundliche Grüße\n{sender}","neutral":"Guten Tag,\n\nwir kommen zurück auf die Rechnung {number} über {amount}, die am {due} fällig war und seit {days} Tagen überfällig ist. Könnten Sie uns das Zahlungsdatum bestätigen oder uns mitteilen, falls bei uns etwas fehlt?\n\nFreundliche Grüße\n{sender}","firm":"Guten Tag,\n\ndie Rechnung {number} über {amount} war am {due} fällig und ist nach unseren früheren Erinnerungen weiterhin offen. Bitte bestätigen Sie uns diese Woche ein Zahlungsdatum oder antworten Sie auf diese Nachricht, falls es ein Problem mit der Rechnung gibt, damit wir es klären können.\n\nFreundliche Grüße\n{sender}","banned":["rechtliche schritte","rechtlichen schritte","rechtsanwalt","anwalt","inkasso","mahnbescheid","gerichtlich","vor gericht","verzugszins","verzugsgebühr","mahngebühr","schufa","schwarze liste","vertragsstrafe"]},"it":{"subject":"Fattura {number} · promemoria di pagamento","friendly":"Buongiorno,\n\nuna breve nota per segnalarvi che la fattura {number} di {amount}, con scadenza il {due}, risulta ancora aperta da parte nostra. Potreste indicarci quando possiamo aspettarci il pagamento?\n\nSe è già in corso, vi ringraziamo e vi preghiamo di ignorare questo messaggio.\n\nCordiali saluti,\n{sender}","neutral":"Buongiorno,\n\nvi scriviamo in merito alla fattura {number} di {amount}, scaduta il {due} e ora in ritardo di {days} giorni rispetto alla scadenza. Potreste confermarci la data di pagamento o dirci se manca qualcosa da parte nostra?\n\nCordiali saluti,\n{sender}","firm":"Buongiorno,\n\nla fattura {number} di {amount}, scaduta il {due}, risulta ancora non pagata dopo i nostri precedenti promemoria. Vi chiediamo di confermarci una data di pagamento entro questa settimana, oppure di rispondere a questo messaggio se ci sono problemi con la fattura, così da poterli risolvere.\n\nCordiali saluti,\n{sender}","banned":["azione legale","azioni legali","avvocat","tribunale","causa legale","interessi di mora","penale","penali","recupero crediti","agenzia di recupero","lista nera","cattivi pagatori","decreto ingiuntivo","diffida"]},"nl":{"subject":"Factuur {number} · betalingsherinnering","friendly":"Goedendag,\n\nGraag een korte herinnering: factuur {number} van {amount}, met vervaldatum {due}, staat bij ons nog open. Kunt u ons laten weten wanneer wij de betaling kunnen verwachten?\n\nIs de betaling al onderweg, dan danken wij u hartelijk en kunt u dit bericht als niet verzonden beschouwen.\n\nMet vriendelijke groet,\n{sender}","neutral":"Goedendag,\n\nWij komen terug op factuur {number} van {amount}, die op {due} verviel en nu {days} dagen over de vervaldatum is. Kunt u de betaaldatum bevestigen, of laten weten als er aan onze kant iets ontbreekt?\n\nMet vriendelijke groet,\n{sender}","firm":"Goedendag,\n\nFactuur {number} van {amount} verviel op {due} en staat nog open na onze eerdere herinneringen. Wilt u deze week een betaaldatum aan ons bevestigen, of op dit bericht reageren als er een probleem is met de factuur, zodat wij dit samen kunnen oplossen?\n\nMet vriendelijke groet,\n{sender}","banned":["juridische stappen","rechtszaak","advocaat","deurwaarder","incasso","gerechtelijk","naar de rechter","wettelijke rente","boeterente","aanmaningskosten","zwarte lijst","kredietregistratie"]},"sv":{"subject":"Faktura {number} · betalningspåminnelse","friendly":"Hej,\n\nEn snabb notering: faktura {number} på {amount}, med förfallodatum {due}, står fortfarande som öppen hos oss. Kan ni meddela när vi kan vänta oss betalningen?\n\nÄr den redan på väg, tack så mycket, och bortse då från det här meddelandet.\n\nMed vänliga hälsningar\n{sender}","neutral":"Hej,\n\nVi följer upp faktura {number} på {amount}, som förföll den {due} och nu är {days} dagar försenad. Kan ni bekräfta betalningsdatumet, eller meddela om något saknas hos oss?\n\nMed vänliga hälsningar\n{sender}","firm":"Hej,\n\nFaktura {number} på {amount} förföll den {due} och är fortfarande obetald efter våra tidigare påminnelser. Bekräfta gärna ett betalningsdatum den här veckan, eller svara på det här meddelandet om det finns ett problem med fakturan så att vi kan lösa det.\n\nMed vänliga hälsningar\n{sender}","banned":["juridiska åtgärder","rättsliga åtgärder","rättsliga steg","advokat","inkasso","domstol","stämning","dröjsmålsränta","kronofogden","betalningsanmärkning","svartlista","kravbrev"]},"da":{"subject":"Faktura {number} · betalingspåmindelse","friendly":"Hej,\n\nEn kort besked om, at faktura {number} på {amount}, som forfaldt den {due}, stadig står som åben hos os. Kan I give os besked om, hvornår vi kan forvente betalingen?\n\nHvis den allerede er på vej, så mange tak, og se bort fra denne besked.\n\nMed venlig hilsen\n{sender}","neutral":"Hej,\n\nVi følger op på faktura {number} på {amount}, som havde forfald den {due} og nu er {days} dage forfalden. Kan I bekræfte betalingsdatoen eller fortælle os, hvis der mangler noget hos os?\n\nMed venlig hilsen\n{sender}","firm":"Hej,\n\nFaktura {number} på {amount} havde forfald den {due} og er stadig ubetalt efter vores tidligere påmindelser. Bekræft gerne en betalingsdato i denne uge, eller svar på denne besked, hvis der er et problem med fakturaen, så vi kan løse det.\n\nMed venlig hilsen\n{sender}","banned":["juridiske skridt","retslige skridt","retlige skridt","advokat","inkasso","retssag","morarente","rykkergebyr","sort liste","kreditoplysning","retsforfølg"]},"nb":{"subject":"Faktura {number} · betalingspåminnelse","friendly":"Hei,\n\nEn kort melding om at faktura {number} på {amount}, som forfalt {due}, fortsatt står som åpen hos oss. Kan dere gi oss beskjed om når vi kan vente betalingen?\n\nHvis den allerede er på vei, tusen takk, og se bort fra denne meldingen.\n\nMed vennlig hilsen\n{sender}","neutral":"Hei,\n\nVi følger opp faktura {number} på {amount}, som forfalt {due} og nå er {days} dager over forfall. Kan dere bekrefte betalingsdatoen eller fortelle oss om noe mangler hos oss?\n\nMed vennlig hilsen\n{sender}","firm":"Hei,\n\nFaktura {number} på {amount} forfalt {due} og er fortsatt ubetalt etter våre tidligere påminnelser. Bekreft gjerne en betalingsdato denne uken, eller svar på denne meldingen hvis det er et problem med fakturaen, slik at vi kan løse det.\n\nMed vennlig hilsen\n{sender}","banned":["rettslige skritt","juridiske skritt","advokat","inkasso","rettssak","forsinkelsesrente","purregebyr","betalingsanmerkning","svarteliste","namsmann"]},"fi":{"subject":"Lasku {number} · maksumuistutus","friendly":"Hei,\n\nLaskumme {number}, summa {amount} ja eräpäivä {due}, on meillä yhä avoinna. Voisitteko kertoa, milloin voimme odottaa maksua?\n\nJos maksu on jo matkalla, kiitos, ja jättäkää tämä viesti huomiotta.\n\nYstävällisin terveisin,\n{sender}","neutral":"Hei,\n\nTiedustelemme laskun {number} maksua. Laskun summa on {amount}, eräpäivä oli {due} ja siitä on nyt kulunut {days} päivää. Voisitteko vahvistaa maksupäivän tai kertoa, jos meidän puolellamme puuttuu jokin tieto?\n\nYstävällisin terveisin,\n{sender}","firm":"Hei,\n\nLaskun {number} summa on {amount} ja eräpäivä oli {due}. Lasku on edelleen maksamatta aiempien muistutustemme jälkeen. Voisitteko vahvistaa maksupäivän tällä viikolla tai vastata tähän viestiin, jos laskussa on ongelma, jotta voimme selvittää asian?\n\nYstävällisin terveisin,\n{sender}","banned":["oikeustoim","oikeudenkäyn","lakimie","asianajaj","haastehak","tuomioistuim","viivästyskor","perintätoimist","perintäyhtiö","maksuhäiriö","luottotieto","mustalist","ulosott","käräjä"]},"is":{"subject":"Reikningur {number} · greiðsluáminning","friendly":"Góðan dag,\n\nVið viljum benda á að reikningur {number} að upphæð {amount}, með gjalddaga {due}, er enn ógreiddur samkvæmt okkar bókum. Gætirðu látið okkur vita hvenær greiðslu er að vænta?\n\nEf greiðslan er þegar á leiðinni, kærar þakkir, og vinsamlegast hafðu þessi skilaboð að engu.\n\nBestu kveðjur,\n{sender}","neutral":"Góðan dag,\n\nVið fylgjum hér eftir reikningi {number} að upphæð {amount}, sem var á gjalddaga {due} og er nú kominn {days} daga fram yfir gjalddaga. Gætirðu staðfest greiðsludaginn, eða látið okkur vita ef eitthvað vantar frá okkur?\n\nBestu kveðjur,\n{sender}","firm":"Góðan dag,\n\nReikningur {number} að upphæð {amount} var á gjalddaga {due} og er enn ógreiddur þrátt fyrir fyrri áminningar okkar. Vinsamlegast staðfestu greiðsludag í þessari viku, eða svaraðu þessum skilaboðum ef eitthvað er athugavert við reikninginn svo að við getum leyst úr því.\n\nBestu kveðjur,\n{sender}","banned":["lögfræðing","lögma       put('meta[property="og:title"]', 'meta', { property: 'og:title', content: title });
      put('meta[property="og:description"]', 'meta', { property: 'og:description', content: desc });
      if (/^https?:$/.test(location.protocol) && /(^|\.)clearlydue\.(com|es)$/.test(location.hostname)) {
        const href = SITE_URL + (c.lang === 'en' ? '' : '?lang=' + encodeURIComponent(c.lang));
        put('link[rel="canonical"]', 'link', { rel: 'canonical', href });

  /* ---------- in-app: customers ---------- */
  function custRows(w) {
    const t = today(), m = new Map();
    for (const i of w.invoices) { const c = m.get(i.customer) || { name: i.customer, open: 0, over: 0, n: 0, email: '' }; if (!c.email && i.email) c.email = i.email; if (!i.paidOn) { c.n++; c.open += i.amount; if (CC.status(i, t, w.promises) === 'overdue') c.over += i.amount; } m.set(i.customer, c); }
    return [...m.values()].map(c => ({ ...c, hist: CC.payerHistory(w.invoices, c.name), meta: w.customers[c.name] || {} })).sort((a, b) => b.over - a.over || b.open - a.open);
  }
  function vCustomers(w) {

  /* ---------- in-app: monthly review report ---------- */
  function reportData(w) {
    const t = today(), from = CC.addDays(t, -30), T = totals(w), f = CC.forecast(w.invoices, w.promises, t);
    const sent = w.sent.filter(s => s.date >= from), paid = w.invoices.filter(i => i.paidOn && i.paidOn >= from);
    const pr = { kept: 0, broken: 0, pending: 0 }; for (const p of w.promises) { const i = w.invoices.find(x => x.number === p.invoice); if (i) pr[CC.promiseStatus(p, i, t)]++; }
    const late = paid.length ? Math.round(paid.reduce((s, i) => s + CC.diff(i.paidOn, i.due), 0) / paid.length) : null;
    const top = custRows(w).filter(c => c.over > 0).slice(0, 5);
    const stale = w.invoices.filter(i => CC.status(i, t, w.promises) === 'overdue' && CC.diff(t, i.due) > 30).sort((a, b) => (a.due < b.due ? -1 : 1));
    const disputes = w.invoices.filter(i => i.disputed && !i.paidOn);
    return { t, from, T, f, sent, paid, paidSum: paid.reduce((s, i) => s + i.amount, 0), pr, late, top, stale, disputes };
  }
  function reportText(w) {

    ln.push(`## ${L('Position today', 'Situación hoy')}`, `- ${L('Open', 'Abierto')}: ${money(d.T.open)} (${d.T.n} ${L('invoices', 'facturas')})`, `- ${L('Overdue', 'Vencido')}: ${money(d.T.overdue)} (${d.T.open ? Math.round(d.T.overdue / d.T.open * 100) : 0}%)`, `- ${L('Promised', 'Con promesa')}: ${money(d.T.promised)}`, `- ${L('In dispute', 'En disputa')}: ${money(d.T.disputed)}`, `- ${L('Expected in 13 weeks', 'Esperado en 13 semanas')}: ${money(d.f.totals.mid)} (${L('range', 'rango')} ${money(d.f.totals.low)} – ${money(d.f.totals.high)})`, '');
    ln.push(`## ${L('Last 30 days', 'Últimos 30 días')}`, `- ${L('Reminders approved', 'Recordatorios aprobados')}: ${d.sent.length}`, `- ${L('Invoices paid', 'Facturas pagadas')}: ${d.paid.length} · ${money(d.paidSum)}${d.late == null ? '' : ` · ${L('on average', 'de media')} ${d.late} ${L('days after the due date', 'días tras el vencimiento')}`}`, `- ${L('Promises', 'Promesas')}: ${d.pr.kept} ${L('kept', 'cumplidas')}, ${d.pr.broken} ${L('broken', 'incumplidas')}, ${d.pr.pending} ${L('pending', 'pendientes')}`, '');
    ln.push(`## ${L('Where to focus', 'Dónde centrarse')}`);
    if (!d.top.length && !d.stale.length && !d.disputes.length) ln.push(`- ${L('Nothing overdue. Keep the weekly approval routine.', 'Nada vencido. Mantén la rutina semanal de aprobación.')}`);
    for (const c of d.top) ln.push(`- ${c.name}: ${money(c.over)} ${L('overdue', 'vencido')}`);
    for (const i of d.stale.slice(0, 5)) ln.push(`- ${i.number} (${i.customer}): ${CC.diff(d.t, i.due)} ${L('days overdue, no promise on file', 'días vencida, sin promesa registrada')}`);
    for (const i of d.disputes) ln.push(`- ${i.number} (${i.customer}): ${L('dispute open', 'disputa abierta')}${i.disputeNote ? ' · ' + i.disputeNote : ''}`);
    ln.push('', L('Planning view built from your own records. Not a guarantee of payment.', 'Vista de planificación a partir de tus propios registros. No garantiza el cobro.'));
    return ln.join('\n');
  }

    doimport(_, w) { const room = CCP.importRoom(planKey(), w.invoices), cut = Math.max(0, imp.valid.ok.length - room), ok = imp.valid.ok.slice(0, room); for (const r of ok) { w.invoices.push({ ...r }); const c = w.customers[r.customer] || (w.customers[r.customer] = {}); if (r.email && !c.email) c.email = r.email; if (r.lang && !c.lang) c.lang = r.lang; } log(w, 'import', ok.length + ' invoices', `${imp.valid.issues.filter(x => x.level === 'error').length} blocked issues, ${imp.valid.issues.filter(x => x.level === 'warn').length} warnings`); flash = L(`${ok.length} invoice${ok.length === 1 ? '' : 's'} imported.`, `${ok.length} factura${ok.length === 1 ? '' : 's'} importada${ok.length === 1 ? '' : 's'}.`); if (cut) flash += ' ' + L(`${cut} not imported: your plan includes up to ${plan().maxOpen} open invoices.`, `${cut} sin importar: tu plan incluye hasta ${plan().maxOpen} facturas abiertas.`); imp = null; view = 'receivables'; filter = 'all'; },

    pause(_, w) { const i = w.invoices.find(x => x.number === detail); i.paused = !i.paused; log(w, i.paused ? 'pause' : 'resume', detail); },
    saverules(_, w) { if (!can('rules')) { w.sender = document.getElementById('sender').value.trim() || w.name; log(w, 'rules', 'signature'); flash = L('Signature saved.', 'Firma guardada.'); return; } const num = (v, lo, hi, d) => { const n = Math.round(Number(v)); return isFinite(n) ? Math.min(hi, Math.max(lo, n)) : d; }; w.sender = document.getElementById('sender').value.trim() || w.name; document.querySelectorAll('[data-step]').forEach(e => { w.rules.steps[e.dataset.step].after = num(e.value, 0, 120, 3); }); document.querySelectorAll('[data-tone]').forEach(e => { w.rules.steps[e.dataset.tone].tone = e.value; }); w.rules.steps.sort((a, b) => a.after - b.after); w.rules.minGap = num(document.getElementById('mingap').value, 1, 60, 6); w.rules.dailyCap = num(document.getElementById('cap').value, 1, 200, 40); w.rules.skipWeekends = document.getElementById('wk').checked; log(w, 'rules', '', JSON.stringify(w.rules)); flash = L('Rules saved.', 'Reglas guardadas.'); },

    manadd(_, w) {
      const keys = ['number', 'customer', 'amount', 'due', 'email', 'issue', 'currency', 'lang']; man = {}; keys.forEach(k => { man[k] = (val('m-' + k) || '').trim(); });
