*{box-sizing:border-box;margin:0;padding:0}

.mk *{box-sizing:border-box}
.mk-w{max-width:1180px;margin:0 auto;padding:0 28px}
.mk-main{display:block;max-width:none;width:auto;padding:0;margin:0}
.mk h1,.mk h2,.mk h3,.mk h4{margin:0;color:var(--mk-ink);text-transform:none;letter-spacing:-.035em;font-weight:800;line-height:1.04}
.mk h1{font-size:clamp(38px,6.3vw,80px);letter-spacing:-.05em;line-height:1}
.mk h2{font-size:clamp(30px,4.6vw,56px)}
.mk h3{font-size:clamp(21px,2.2vw,28px);letter-spacing:-.025em;line-height:1.12;font-weight:750}
.mk h4{font-size:17px;letter-spacing:-.01em;line-height:1.25;font-weight:700}
.mk p{margin:0}
.mk-lead{font-size:clamp(17px,1.6vw,21px);color:var(--mk-soft);line-height:1.45}
.mk-eyebrow{font-size:14px;font-weight:650;color:var(--mk-soft);letter-spacing:0;margin-bottom:10px}
.mk-sec{padding:clamp(64px,9vw,128px) 0 0}
.mk-sec>.mk-w>h2{max-width:900px}
.mk-sec .mk-lead{max-width:680px;margin-top:16px}
.mk sup{font-size:.5em;vertical-align:super;line-height:0;letter-spacing:0;font-weight:600}

/* buttons */
.mk-btn{font:inherit;font-size:16px;font-weight:650;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:12px;border:1px solid transparent;text-decoration:none;white-space:nowrap;transition:transform .15s ease,background .15s ease,box-shadow .15s ease}
.mk-btn:active{transform:scale(.97)}
.mk-btn.pri{background:var(--mk-teal);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 6px 16px -8px rgba(10,127,112,.7)}
.mk-btn.pri:hover{background:#086B5F}
.mk-btn.sec{background:#E4F3F0;color:#075E53}
.mk-btn.sec:hover{background:#D3ECE7}
.mk-btn.dark{background:var(--mk-ink);color:#fff}
.mk-btn.dark:hover{background:#16305A}
.mk-btn.ghost{background:transparent;color:var(--mk-ink);border-color:var(--mk-line)}
.mk-btn.ghost:hover{background:var(--mk-warm)}
.mk-btn.sm{padding:8px 14px;font-size:14.5px;border-radius:10px}
.mk-btn.lg{padding:15px 26px;font-size:17px;border-radius:14px}
.mk-arrow{width:40px;height:40px;border-radius:50%;background:var(--mk-ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;border:0;cursor:pointer;flex:none;transition:transform .2s ease,background .2s ease}
.mk-arrow svg{width:18px;height:18px}
.mk-card:hover .mk-arrow,.mk-arrow:hover{transform:translateX(4px);background:var(--mk-teal)}

/* top bar */
.mk-top{position:sticky;top:0;z-index:30;display:block;padding:0;background:rgba(255,255,255,.86);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s ease,box-shadow .2s ease}
.mk-top.scrolled{border-bottom-color:var(--mk-line);box-shadow:0 8px 24px -20px rgba(11,31,58,.35)}
.mk-top-in{display:flex;align-items:center;gap:10px;min-height:66px}
.mk-top .logo{font-size:19px;color:var(--mk-ink);background:none;border:0;padding:0;cursor:pointer;font-family:inherit}
.mk-top .sitenav{display:flex;gap:2px;margin-left:18px}
.mk-top .sitenav button,.mk-top .sitenav a{all:unset;cursor:pointer;padding:8px 12px;border-radius:9px;font-size:15px;font-weight:550;color:#33445A}
.mk-top .sitenav button:hover,.mk-top .sitenav a:hover{background:var(--mk-warm)}
.mk-top .sitenav button:focus-visible,.mk-top .sitenav a:focus-visible,.mk-link:focus-visible{outline:3px solid #5EEAD4;outline-offset:2px}
.mk-grow{flex:1}
.mk-link{all:unset;cursor:pointer;padding:8px 10px;border-radius:9px;font-size:15px;font-weight:600;color:var(--mk-ink)}
.mk-link:hover{background:var(--mk-warm)}
/* all:unset first, so display:none below wins */
.mk-burger{all:unset;display:none;cursor:pointer;width:42px;height:42px;border-radius:10px;align-items:center;justify-content:center}
.mk-burger:hover{background:var(--mk-warm)}
.mk-burger svg{width:22px;height:22px}
.mk-menu{display:none;padding:6px 0 18px}
.mk-menu button:not(.mk-btn),.mk-menu a{all:unset;cursor:pointer;display:block;padding:13px 4px;font-size:19px;font-weight:650;border-bottom:1px solid var(--mk-line)}
.mk-menu .mk-btn{width:100%;margin-top:16px}

/* hero */
.mk-hero{text-align:center;padding:clamp(28px,4.4vw,56px) 0 0;position:relative}
.mk-chip{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:var(--mk-warm);font-size:14px;font-weight:600;color:var(--mk-soft);margin-bottom:26px}
.mk-chip i{width:8px;height:8px;border-radius:50%;background:var(--mk-teal2);display:inline-block}
.mk-hero h1{max-width:1120px;margin:0 auto}
.mk-rot{display:inline-grid;vertical-align:bottom;margin-top:.08em}
.mk-pill{grid-area:1/1;justify-self:center;display:inline-flex;align-items:center;gap:.28em;padding:.06em .42em .12em .34em;border-radius:.42em;white-space:nowrap;opacity:0;transform:translateY(38%) scale(.94);transition:opacity .45s ease,transform .6s cubic-bezier(.2,.9,.25,1.15);pointer-events:none}
.mk-pill.on{opacity:1;transform:none}
.mk-pill.out{opacity:0;transform:translateY(-38%) scale(.94)}
.mk-pill:before{content:'';width:.3em;height:.3em;border-radius:50%;background:currentColor;flex:none;margin-top:.06em}
.mk-pill.c0{background:#DFF5F1;color:#0A7F70}.mk-pill.c1{background:#FFF1D6;color:#8A5A00}.mk-pill.c2{background:#EEE9FB;color:#5237A8}.mk-pill.c3{background:#E3ECFD;color:#1741A6}
.mk-pill b{font-weight:inherit;color:var(--mk-ink)}
.mk-hero .mk-lead{max-width:650px;margin:26px auto 0}
.mk-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:30px}
.mk-fine{font-size:14px;color:#5B6B7F;margin-top:14px}
.mk-doodle{position:absolute;pointer-events:none;animation:mkfloat 7s ease-in-out infinite}
.mk-doodle svg{display:block;width:100%;height:auto}
@keyframes mkfloat{0%,100%{transform:translateY(0) rotate(var(--rot,0deg))}50%{transform:translateY(-12px) rotate(calc(var(--rot,0deg) + 3deg))}}

/* product window */
.mk-stage{position:relative;margin:clamp(36px,5vw,64px) auto 0;max-width:1080px}
.mk-stage:before{content:'';position:absolute;inset:8% -6% -8%;background:radial-gradient(60% 60% at 30% 40%,rgba(18,181,160,.22),transparent 70%),radial-gradient(55% 55% at 75% 55%,rgba(82,55,168,.14),transparent 70%),radial-gradient(40% 50% at 55% 20%,rgba(255,193,77,.18),transparent 70%);filter:blur(30px);z-index:0}
.mk-win{position:relative;z-index:1;background:#fff;border:1px solid var(--mk-line);border-radius:18px;box-shadow:0 40px 80px -36px rgba(11,31,58,.45),0 2px 0 rgba(255,255,255,.7) inset;overflow:hidden;text-align:left}
.mk-winbar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--mk-warm);border-bottom:1px solid var(--mk-line)}
.mk-dots{display:flex;gap:6px;margin-right:8px}.mk-dots i{width:10px;height:10px;border-radius:50%;background:#D9D5CC;display:block}
.mk-tabs{display:flex;gap:4px;flex-wrap:wrap}
.mk-tab{all:unset;cursor:pointer;font-size:13.5px;font-weight:650;color:#5B6B7F;padding:6px 12px;border-radius:9px;position:relative}
.mk-tab:hover{background:#ECE9E2}
.mk-tab.on{background:#fff;color:var(--mk-ink);box-shadow:0 1px 3px rgba(11,31,58,.14)}
.mk-tab:focus-visible{outline:3px solid #5EEAD4;outline-offset:2px}
.mk-sample{margin-left:auto;font-size:12px;font-weight:650;color:#8A5A00;background:#FFF1D6;border-radius:999px;padding:3px 10px;white-space:nowrap}
.mk-panes{display:grid}
.mk-pane{grid-area:1/1;padding:20px;opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity .4s ease,transform .5s ease,visibility 0s .4s}
.mk-pane.on{opacity:1;visibility:visible;transform:none;transition:opacity .4s ease,transform .5s ease}
.mk-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.mk-kpi{border:1px solid var(--mk-line);border-radius:12px;padding:12px 14px}
.mk-kpi span{display:block;font-size:12.5px;font-weight:600;color:#5B6B7F}
.mk-kpi b{font-size:clamp(17px,2.1vw,24px);font-weight:800;letter-spacing:-.02em}
.mk-tbl{border:1px solid var(--mk-line);border-radius:12px;overflow:hidden}
.mk-tr{display:grid;grid-template-columns:minmax(0,1fr) 110px 84px 118px;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid #F0EEE9;font-size:14px}
.mk-tr:last-child{border-bottom:0}
.mk-tr.hd{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:#5B6B7F;font-weight:650;background:#FBFAF8}
.mk-tr .n{font-weight:650}.mk-tr .m{color:#5B6B7F;font-size:12.5px}
.mk-tr .a{font-variant-numeric:tabular-nums;font-weight:650;text-align:right}.mk-tr>div:last-child{text-align:right}
.mk-pane.on .mk-tr:not(.hd){animation:mkrow .5s ease both}
.mk-pane.on .mk-tr:nth-child(3){animation-delay:.07s}.mk-pane.on .mk-tr:nth-child(4){animation-delay:.14s}.mk-pane.on .mk-tr:nth-child(5){animation-delay:.21s}.mk-pane.on .mk-tr:nth-child(6){animation-delay:.28s}
@keyframes mkrow{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mk-two{display:grid;grid-template-columns:1.45fr 1fr;gap:14px;align-items:start}
.mk-draft{border:1px solid var(--mk-line);border-radius:14px;padding:16px}
.mk-draft .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px;font-size:14px}
.mk-subj{border:1px solid #D8DDE4;border-radius:10px;padding:9px 12px;font-weight:650;font-size:14px;margin-bottom:8px}
.mk-body{border:1px solid #D8DDE4;border-radius:10px;padding:11px 12px;font-size:14px;line-height:1.55;color:#33445A;white-space:pre-line;min-height:118px}
.mk-ok{background:#DFF5F1;color:#075E53;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;margin:10px 0}
.mk-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mk-fake{display:inline-flex;align-items:center;padding:8px 14px;border-radius:10px;font-weight:650;font-size:14px;border:1px solid var(--mk-line);background:#fff}
.mk-fake.go{background:var(--mk-teal);border-color:var(--mk-teal);color:#fff;position:relative}
.mk-pane.on .mk-fake.go{animation:mkpress 5s ease 1.3s both}
@keyframes mkpress{0%,6%{transform:none;box-shadow:0 0 0 0 rgba(18,181,160,0)}9%{transform:scale(.93)}13%{transform:none;box-shadow:0 0 0 10px rgba(18,181,160,.25)}22%,100%{box-shadow:0 0 0 0 rgba(18,181,160,0)}}
.mk-cursor{position:absolute;width:26px;height:26px;left:62%;top:44%;opacity:0;z-index:3;pointer-events:none}
.mk-pane.on .mk-cursor{animation:mkcur 5s ease .2s both}
@keyframes mkcur{0%{opacity:0;left:62%;top:30%}10%{opacity:1}26%{left:var(--cx,9%);top:var(--cy,84%)}30%{transform:scale(.86)}34%{transform:none}70%{opacity:1;left:var(--cx,9%);top:var(--cy,84%)}85%,100%{opacity:0}}
.mk-toast{position:absolute;right:18px;bottom:18px;background:var(--mk-ink);color:#fff;border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:600;opacity:0;transform:translateY(10px);z-index:2;display:flex;gap:8px;align-items:center}
.mk-toast i{width:18px;height:18px;border-radius:50%;background:var(--mk-teal2);display:inline-flex;align-items:center;justify-content:center;font-style:normal;color:#06302B;font-size:12px;font-weight:800}
.mk-pane.on .mk-toast{animation:mktoast 5s ease 1.9s both}
@keyframes mktoast{0%{opacity:0;transform:translateY(10px)}8%,70%{opacity:1;transform:none}85%,100%{opacity:0;transform:translateY(6px)}}
.mk-queue{border:1px solid var(--mk-line);border-radius:14px;padding:14px;font-size:14px}
.mk-queue .q{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #F0EEE9}
.mk-queue .q:last-child{border-bottom:0}
.mk-queue .q b{font-weight:650}.mk-queue .q span{color:#5B6B7F;font-size:12.5px}
.mk-tone{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;background:#E9EDF2;color:#3B4A5C;white-space:nowrap;align-self:center}

/* chart */
.mk-chart{position:relative;border:1px solid var(--mk-line);border-radius:14px;padding:16px 16px 10px}
.mk-chart-h{display:flex;justify-content:space-between;gap:4px 10px;align-items:baseline;margin-bottom:6px;flex-wrap:wrap}
.mk-chart-h b{font-size:15px}.mk-chart-h span{font-size:12.5px;color:#5B6B7F}
.mk-bars{display:grid;grid-template-columns:repeat(13,1fr);gap:clamp(3px,.8vw,10px);align-items:end;height:170px;margin-top:22px;border-bottom:1px solid #D8DDE4;background:repeating-linear-gradient(to top,transparent 0,transparent 41px,#F0EEE9 41px,#F0EEE9 42px);position:relative}
.mk-bar{position:relative;background:#7FD3C6;border-radius:4px 4px 0 0;height:var(--h);min-height:3px;transform-origin:bottom;cursor:default;outline-offset:2px}
.mk-bar.hl{background:var(--mk-teal)}
.mk-bar:hover,.mk-bar:focus-visible{background:#0B1F3A}
.mk-pane.on .mk-bar,.mk-rv.in .mk-bar{animation:mkgrow .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*45ms)}
@keyframes mkgrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.mk-bar .lab{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);font-size:11.5px;font-weight:700;white-space:nowrap;color:var(--mk-ink)}
.mk-xs{display:grid;grid-template-columns:repeat(13,1fr);gap:clamp(3px,.8vw,10px);font-size:11px;color:#5B6B7F;text-align:center;margin-top:5px}
.mk-tip{position:absolute;z-index:5;background:var(--mk-ink);color:#fff;border-radius:10px;padding:8px 11px;font-size:12.5px;line-height:1.4;pointer-events:none;opacity:0;transform:translate(-50%,-100%);transition:opacity .12s ease;white-space:nowrap}
.mk-tip.on{opacity:1}
.mk-tip b{font-size:13.5px}
.mk-why{font-size:14px}
.mk-why .y{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #F0EEE9;align-items:flex-start}
.mk-why .y:last-child{border-bottom:0}
.mk-why .y i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--mk-teal)}
.mk-why .y.n i{background:#B9C2CD}
.mk-why b{font-weight:650}.mk-why span{display:block;color:#5B6B7F;font-size:13px}

/* ticker */
.mk-ticker{margin-top:clamp(40px,6vw,72px);border-top:1px solid var(--mk-line);border-bottom:1px solid var(--mk-line);overflow:hidden;padding:16px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mk-track{display:flex;gap:44px;width:max-content;animation:mkmarq 38s linear infinite}
.mk-ticker:hover .mk-track{animation-play-state:paused}
.mk-track span{display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:600;color:#33445A;white-space:nowrap}
.mk-track svg{width:20px;height:20px;flex:none}
@keyframes mkmarq{to{transform:translateX(-50%)}}

/* reveal */
.mk-rv{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .8s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0s)}
.mk-rv.in{opacity:1;transform:none}

/* stat */
.mk-stat{display:grid;grid-template-columns:1fr 1.1fr;gap:clamp(20px,4vw,56px);align-items:center;background:var(--mk-warm);border-radius:28px;padding:clamp(26px,4.5vw,56px);margin-top:36px}
.mk-big{font-size:clamp(76px,13vw,176px);font-weight:800;letter-spacing:-.06em;line-height:.86;font-variant-numeric:tabular-nums}
.mk-big small{display:block;font-size:.2em;letter-spacing:-.02em;font-weight:750;margin-top:.5em;line-height:1.1}
.mk-hb{margin-top:8px}
.mk-hb .l{display:flex;justify-content:space-between;font-size:14.5px;font-weight:650;margin:16px 0 7px}
.mk-hb .l b{font-weight:650}.mk-hb .l span{color:var(--mk-soft);font-weight:600;white-space:nowrap}
.mk-hb .t{height:22px;border-radius:6px;background:#E4E1DA;position:relative;overflow:hidden}
.mk-hb .t i{position:absolute;inset:0 auto 0 0;width:0;border-radius:0 6px 6px 0;background:#9AA6B4;transition:width 1.2s cubic-bezier(.2,.8,.2,1) .2s}
.mk-hb .t.hot i{background:var(--mk-ink)}
.mk-rv.in .mk-hb .t i{width:var(--w)}
.mk-src{font-size:12.5px;color:#5B6B7F;margin-top:18px;line-height:1.5}

/* feature cards */
.mk-grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:40px}
.mk-card{background:var(--mk-warm);border-radius:var(--mk-r);padding:clamp(22px,2.8vw,34px);position:relative;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.mk-card.wide{grid-column:1/-1;display:grid;grid-template-columns:.85fr 1.3fr;gap:clamp(18px,3vw,40px);align-items:center}
.mk-card .hdr{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-top:auto}
.mk-card h3{max-width:440px}
.mk-card .vis{margin:22px 0 0;background:#fff;border:1px solid var(--mk-line);border-radius:16px;padding:16px;box-shadow:0 18px 40px -28px rgba(11,31,58,.35);min-width:0}
.mk-card:not(.wide) .vis{margin:0 0 26px;order:-1}
.mk-card.wide .vis{margin:0}
.mk-card p.t{color:var(--mk-soft);margin-top:10px;font-size:16px;max-width:460px}
.mk-file{display:flex;align-items:center;gap:10px;border:1px dashed #C9CED6;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:650;margin-bottom:12px}
.mk-file svg{width:26px;height:26px;flex:none}
.mk-file span{color:#5B6B7F;font-weight:500;font-size:12.5px;margin-left:auto}
.mk-map{display:grid;gap:7px;font-size:13.5px}
.mk-map div{display:grid;grid-template-columns:1fr 18px 1fr 20px;gap:8px;align-items:center}
.mk-map code{font:inherit;background:var(--mk-warm);border-radius:7px;padding:5px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk-map em{font-style:normal;font-weight:650}
.mk-map .ar{color:#9AA6B4;text-align:center}
.mk-tick{width:20px;height:20px;border-radius:50%;background:#DFF5F1;color:#0A7F70;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.mk-flag{margin-top:12px;background:#FFF1D6;color:#8A5A00;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600}
.mk-tones{display:flex;gap:6px;flex-wrap:wrap}
.mk-tonebtn{all:unset;cursor:pointer;font-size:13.5px;font-weight:650;padding:6px 13px;border-radius:999px;border:1px solid var(--mk-line);background:#fff;color:#33445A}
.mk-tonebtn:hover{background:var(--mk-warm)}
.mk-tonebtn.on{background:var(--mk-ink);border-color:var(--mk-ink);color:#fff}
.mk-tonebtn:focus-visible{outline:3px solid #5EEAD4;outline-offset:2px}

/* link rows */
.mk-rows{margin-top:28px;display:grid;gap:10px}
.mk-row{all:unset;cursor:pointer;display:flex;align-items:center;gap:16px;border:1px solid var(--mk-line);border-radius:16px;padding:14px 18px;font-size:clamp(16px,1.6vw,19px);font-weight:650;transition:background .15s ease,transform .15s ease,border-color .15s ease}
.mk-row:hover{background:var(--mk-warm);border-color:#D8D4CA;transform:translateX(4px)}
.mk-row:focus-visible{outline:3px solid #5EEAD4;outline-offset:2px}
.mk-ico{width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.mk-ico svg{width:24px;height:24px}
.mk-ico.kt{background:#DFF5F1;color:#0A7F70}.mk-ico.ka{background:#FFF1D6;color:#8A5A00}.mk-ico.kv{background:#EEE9FB;color:#5237A8}.mk-ico.kb{background:#E3ECFD;color:#1741A6}.mk-ico.kr{background:#FDE8E8;color:#A32626}.mk-ico.kn{background:#E9EDF2;color:#0B1F3A}
.mk-row .go{margin-left:auto;color:#9AA6B4;font-weight:500;transition:transform .15s ease,color .15s ease}
.mk-row:hover .go{color:var(--mk-ink);transform:translateX(3px)}

/* live demo */
.mk-live{display:grid;grid-template-columns:.8fr 1.25fr;gap:clamp(18px,3vw,44px);align-items:start;margin-top:40px;background:linear-gradient(135deg,#E9F7F4,#F3F0FC 55%,#FFF6E3);border-radius:28px;padding:clamp(22px,3.6vw,48px)}
.mk-live h4{margin:22px 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mk-soft)}
.mk-live h4:first-child{margin-top:0}
.mk-inv{display:grid;gap:8px}
.mk-invbtn{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;background:rgba(255,255,255,.72);border:1px solid rgba(11,31,58,.08);border-radius:12px;padding:10px 14px;font-size:14.5px}
.mk-invbtn b{font-weight:650;display:block}.mk-invbtn span{color:#5B6B7F;font-size:12.5px}
.mk-invbtn.on{background:#fff;border-color:var(--mk-ink);box-shadow:0 8px 18px -14px rgba(11,31,58,.5)}
.mk-invbtn.done{opacity:.7}
.mk-invbtn:focus-visible{outline:3px solid #5EEAD4;outline-offset:2px}
.mk-livecard{background:#fff;border-radius:18px;padding:18px;box-shadow:0 26px 60px -34px rgba(11,31,58,.5);border:1px solid rgba(11,31,58,.06)}
.mk-livecard .mk-body{min-height:190px}
.mk-realbtn{font:inherit;cursor:pointer;display:inline-flex;align-items:center;padding:9px 16px;border-radius:10px;font-weight:650;font-size:14.5px;border:1px solid var(--mk-line);background:#fff;color:var(--mk-ink)}
.mk-realbtn.go{background:var(--mk-teal);border-color:var(--mk-teal);color:#fff}
.mk-realbtn.go:hover{background:#086B5F}
.mk-realbtn:disabled{opacity:.5;cursor:default}
.mk-progress{font-size:13.5px;color:var(--mk-soft);margin-left:auto;font-weight:600}
.mk-done{display:none;background:#DFF5F1;color:#075E53;border-radius:12px;padding:12px 14px;font-weight:650;font-size:14.5px;margin-top:12px}
.mk-done.on{display:block;animation:mkrow .4s ease both}

/* bento */
.mk-bento{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:40px}
.mk-b{border-radius:var(--mk-r);padding:24px;min-height:210px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.mk-b p{color:var(--mk-soft);font-size:15.5px}
.mk-b .mk-ico{margin-bottom:10px;background:rgba(255,255,255,.75)}
.mk-b.kt{background:#E6F6F3}.mk-b.ka{background:#FFF4DE}.mk-b.kv{background:#F1EDFC}.mk-b.kb{background:#E8EFFD}.mk-b.kn{background:var(--mk-warm)}.mk-b.kr{background:#FDEDED}
.mk-plan{align-self:flex-start;margin-top:auto;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:rgba(255,255,255,.8);color:#33445A}

/* firms */
.mk-firms{background:var(--mk-ink);color:#fff;border-radius:32px;padding:clamp(26px,4.6vw,64px);display:grid;grid-template-columns:1fr 1fr;gap:clamp(22px,4vw,56px);align-items:center;margin-top:8px;position:relative;overflow:hidden}
.mk-firms:before{content:'';position:absolute;width:520px;height:520px;right:-160px;top:-200px;border-radius:50%;background:radial-gradient(circle,rgba(18,181,160,.35),transparent 65%)}
.mk-firms h2,.mk-firms h4{color:#fff}
.mk-firms .mk-eyebrow{color:#5EEAD4}
.mk-firms p.mk-lead{color:#B8C4D6}
.mk-firms ul{list-style:none;margin:22px 0 28px;padding:0;display:grid;gap:11px}
.mk-firms li{display:flex;gap:12px;font-size:16.5px;color:#DCE4EF;align-items:flex-start}
.mk-firms li:before{content:'✓';flex:none;width:22px;height:22px;border-radius:50%;background:rgba(94,234,212,.18);color:#5EEAD4;display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;margin-top:2px}
.mk-clients{position:relative;z-index:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:16px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.mk-clients .h{display:flex;justify-content:space-between;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:#9FB0C7;font-weight:650;padding:4px 8px 10px}
.mk-cl{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;background:rgba(255,255,255,.07);border-radius:13px;padding:10px 12px;margin-bottom:8px}
.mk-cl:last-child{margin-bottom:0}
.mk-av{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#0B1F3A}
.mk-cl b{font-weight:650;font-size:15px;display:block;color:#fff}.mk-cl span{font-size:12.5px;color:#9FB0C7}
.mk-cl .amt{text-align:right;font-variant-numeric:tabular-nums}
.mk-cl .amt em{font-style:normal;display:block;font-size:12.5px;color:#FFB4B4;font-weight:600}

/* not-do cards */
.mk-nots{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:40px}
.mk-not{border-radius:20px;padding:20px;min-height:200px;display:flex;flex-direction:column;justify-content:space-between;gap:20px;transition:transform .25s ease}
.mk-not:hover{transform:translateY(-6px) rotate(-1deg)}
.mk-not .x{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px}
.mk-not b{font-size:17px;line-height:1.25;letter-spacing:-.01em;font-weight:700}
.mk-not.c0{background:#FDE8E8;color:#7A1C1C}.mk-not.c1{background:#FFF1D6;color:#6B4600}.mk-not.c2{background:#E3ECFD;color:#12327F}.mk-not.c3{background:#EEE9FB;color:#40298A}.mk-not.c4{background:#DFF5F1;color:#075E53}

/* pricing */
.mk-pricing{margin-top:36px}
.mk-pricing .plans,.mk-pricing .prices{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:12px}
.mk-pricing .price{background:#fff;border:1px solid var(--mk-line);border-radius:20px;padding:24px;margin:0;display:flex;flex-direction:column;gap:6px;overflow:visible;transition:transform .2s ease,box-shadow .2s ease}
.mk-pricing .price:hover{transform:translateY(-4px);box-shadow:0 24px 44px -30px rgba(11,31,58,.45)}
.mk-pricing .price.hl{border:2px solid var(--mk-teal);background:linear-gradient(180deg,#F1FBF9,#fff 40%)}
.mk-pricing .price>.b,.mk-pricing .price>b{font-size:19px;font-weight:750}
.mk-pricing .price .p,.mk-pricing .price .amt{font-size:42px;font-weight:800;letter-spacing:-.04em;line-height:1.1}
.mk-pricing .price .p span,.mk-pricing .price .amt small{font-size:14px;font-weight:500;color:#5B6B7F;letter-spacing:0}
.mk-pricing .price ul{margin:10px 0 18px 18px;padding:0;color:#41546B;font-size:14.5px;line-height:1.6;flex:1}
.mk-pricing .price .btn{padding:11px 14px;border-radius:12px;font-size:15px}
.mk-pricing h3{margin:40px 0 14px}
.mk-pricing .card{border-radius:18px;border-color:var(--mk-line)}
.mk-pricing table{font-size:14.5px}
.mk-pricing .matrix td,.mk-pricing .matrix th,.mk-pricing .cmp td,.mk-pricing .cmp th{text-align:center}
.mk-pricing .matrix td:first-child,.mk-pricing .matrix th:first-child,.mk-pricing .cmp td:first-child,.mk-pricing .cmp th:first-child{text-align:left}
.mk-note{font-size:14px;color:#5B6B7F;margin-top:10px}

/* faq */
.mk-faqs{display:grid;grid-template-columns:.7fr 1.3fr;gap:clamp(20px,4vw,60px);align-items:start}
.mk-faq{border-bottom:1px solid var(--mk-line);margin:0;padding:0}
.mk-faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:16px;align-items:center;padding:20px 2px;font-size:clamp(17px,1.7vw,20px);font-weight:650;letter-spacing:-.01em}
.mk-faq summary::-webkit-details-marker{display:none}
.mk-faq summary:after{content:'+';flex:none;width:32px;height:32px;border-radius:50%;background:var(--mk-warm);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:500;transition:transform .25s ease,background .2s ease}
.mk-faq[open] summary:after{transform:rotate(45deg);background:var(--mk-ink);color:#fff}
.mk-faq p{color:var(--mk-soft);padding:0 44px 22px 2px;font-size:16.5px;line-height:1.55}

/* final cta + footer */
.mk-final{background:var(--mk-warm);margin-top:clamp(64px,9vw,128px);padding:clamp(56px,8vw,112px) 0;text-align:center;position:relative;overflow:hidden}
.mk-final h2{max-width:820px;margin:0 auto}
.mk-foot{padding:56px 0 40px;font-size:14.5px}
.mk-cols{display:grid;grid-template-columns:1.6fr repeat(3,1fr);gap:32px}
.mk-foot .logo{font-size:20px}
.mk-motto{font-size:17px;color:var(--mk-soft);margin-top:16px;max-width:300px;line-height:1.4}
.mk-col b{display:block;font-size:13px;color:#5B6B7F;font-weight:600;margin-bottom:12px}
.mk-col button,.mk-col a{all:unset;cursor:pointer;display:block;padding:5px 0;font-weight:600;color:var(--mk-ink);font-size:15px}
.mk-col button:hover,.mk-col a:hover{color:var(--mk-teal)}
.mk-col button:focus-visible,.mk-col a:focus-visible{outline:3px solid #5EEAD4;outline-offset:2px}
.mk-col span{display:block;padding:5px 0;color:var(--mk-soft)}
.mk-legal{border-top:1px solid var(--mk-line);margin-top:36px;padding-top:20px;font-size:12.5px;color:#5B6B7F;display:grid;gap:6px;line-height:1.5}

/* partner page */
.mk-status{background:#FFF7E6;border:1px solid #F3DFB2;border-radius:18px;padding:18px 22px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin-top:40px;text-align:left}
.mk-status b{font-weight:700}
.mk-status p{color:#5C4300;font-size:15.5px}
.mk-gg{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:40px}
.mk-gg .mk-card ul{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:12px}
.mk-gg .mk-card li{display:flex;gap:12px;font-size:16.5px;align-items:flex-start}
.mk-gg .mk-card li:before{content:'✓';flex:none;width:24px;height:24px;border-radius:50%;background:#fff;color:var(--mk-teal);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;margin-top:1px}
.mk-gg .mk-card.ask li:before{content:'→';color:#5237A8}
.mk-gg .mk-card.get{background:#E6F6F3}.mk-gg .mk-card.ask{background:#F1EDFC}
.mk-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:40px;counter-reset:s}
.mk-step{background:var(--mk-warm);border-radius:var(--mk-r);padding:26px;position:relative}
.mk-step .wk{display:inline-block;font-size:13px;font-weight:700;background:#fff;border-radius:999px;padding:4px 12px;margin-bottom:16px}
.mk-step p{color:var(--mk-soft);margin-top:8px;font-size:15.5px}
.mk-apply{display:grid;grid-template-columns:.8fr 1.2fr;gap:clamp(20px,4vw,56px);align-items:start;margin-top:8px;background:var(--mk-ink);border-radius:32px;padding:clamp(24px,4.4vw,60px);color:#fff}
.mk-apply h2{color:#fff}.mk-apply .mk-lead{color:#B8C4D6}
.mk-apply .mk-eyebrow{color:#5EEAD4}
.mk-form{background:#fff;color:var(--mk-ink);border-radius:20px;padding:22px;display:grid;gap:14px}
.mk-form label{font-size:13.5px;font-weight:650;color:#33445A;display:grid;gap:5px}
.mk-form input[type=text],.mk-form input[type=email],.mk-form select,.mk-form textarea{font:inherit;font-size:15.5px;border:1px solid #CFD7E0;border-radius:11px;padding:11px 12px;background:#fff;color:var(--mk-ink);width:100%}
.mk-form .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end}
.mk-form label.chk{display:flex;gap:10px;align-items:flex-start;font-weight:500;font-size:14.5px;line-height:1.45}
.mk-form label.chk input{margin-top:3px;flex:none;width:17px;height:17px}
.mk-err{background:#FDE8E8;color:#A32626;border-radius:11px;padding:10px 14px;font-weight:650;font-size:14.5px}
.mk-sent{background:#DFF5F1;color:#075E53;border-radius:14px;padding:16px;font-size:15.5px;display:grid;gap:10px}
.mk-sent textarea{font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;border:1px solid #BFE5DD;border-radius:10px;padding:10px;width:100%;background:#fff;color:var(--mk-ink);resize:vertical}

/* sign-up, sign-in and legal pages sit under the same top bar */
.mk main.site{padding-top:8px}

/* responsive */
@media(max-width:1020px){.mk-nots{grid-template-columns:repeat(3,1fr)}.mk-pricing .plans,.mk-pricing .prices{grid-template-columns:1fr 1fr}.mk-doodle.far{display:none}}
@media(max-width:900px){
  .mk-top .sitenav,.mk-top .mk-hide-m{display:none}
  .mk-burger{display:inline-flex}
  .mk-top.open .mk-menu{display:block}
  .mk-stat,.mk-card.wide,.mk-live,.mk-firms,.mk-faqs,.mk-apply,.mk-gg{grid-template-columns:1fr}
  .mk-grid2{grid-template-columns:1fr}
  .mk-bento{grid-template-columns:1fr 1fr}
  .mk-steps{grid-template-columns:1fr}
  .mk-two{grid-template-columns:1fr}
  .mk-cols{grid-template-columns:1fr 1fr}
  .mk-doodle{display:none}
  .mk-kpis{grid-template-columns:1fr 1fr}
  .mk-card.wide .vis{order:-1}
}
@media(max-width:620px){
  .mk-w{padding:0 18px}
  .mk-top-in .mk-top-r>.mk-btn{display:none}
  .mk-bento,.mk-nots{grid-template-columns:1fr}
  .mk-b{min-height:0}.mk-not{min-height:0;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px}
  .mk-pricing .plans,.mk-pricing .prices{grid-template-columns:1fr}
  .mk-pricing .card{overflow:auto}
  .mk-tr{grid-template-columns:minmax(0,1fr) 78px 104px;font-size:13px;padding:9px 10px}
  .mk-tr .c3{display:none}
  .mk-pane{padding:12px}
  .mk-sample{display:none}
  .mk-tab{padding:6px 9px;font-size:12.5px}
  .mk-form .two{grid-template-columns:1fr}
  .mk-btn.lg{padding:14px 20px;font-size:16px}
  .mk-cta .mk-btn{flex:1 1 100%}
  .mk-faq p{padding-right:8px}
  .mk-status{grid-template-columns:1fr}
  .mk-bar .lab{font-size:10px}
  .mk-xs{font-size:9px}
  .mk-map div{grid-template-columns:1fr 14px 1fr 20px}
  .mk-rot{display:grid;max-width:100%}.mk-pill{white-space:normal;text-align:center;justify-content:center;max-width:100%}.mk-pill:before{display:none}
}
@media(prefers-reduced-motion:reduce){
  .mk *,.mk *:before,.mk *:after{animation:none!important;transition:none!important}
  .mk-rv{opacity:1;transform:none}
  .mk-hb .t i{width:var(--w)}
  .mk-toast{opacity:1;transform:none}
}
@media print{.mk-top,.mk-ticker,.mk-doodle{display:none}.mk-rv{opacity:1;transform:none}}

.mk-inl{all:unset;cursor:pointer;color:var(--mk-teal);font-weight:650;text-decoration:underline}
.mk-inl:focus-visible{outline:3px solid #5EEAD4;outline-offset:2px}

/* ---- languages ---- */
.mk-lang{font:inherit;font-size:14.5px;font-weight:600;color:var(--mk-ink);background:transparent;border:1px solid var(--mk-line);border-radius:10px;padding:7px 8px;max-width:158px;cursor:pointer}
.mk-lang:hover{background:var(--mk-warm)}
.mk-lang:focus-visible{outline:3px solid #5EEAD4;outline-offset:2px}
.mk-col .mk-lang{display:block;margin-top:6px;max-width:210px}
.mk-rot{max-width:100%}
.mk-pill{white-space:normal;text-align:center;max-width:100%}
.mk-tab,.mk-tonebtn{white-space:nowrap}
@media(max-width:620px){.mk-btn{white-space:normal;text-align:center}.mk-lang{max-width:124px}}
/* right-to-left languages */
[dir=rtl] .mk-win,[dir=rtl] .mk-status{text-align:right}
[dir=rtl] .mk-top .sitenav{margin-left:0;margin-right:18px}
[dir=rtl] .mk-sample,[dir=rtl] .mk-progress,[dir=rtl] .mk-file span,[dir=rtl] .mk-row .go{margin-left:0;margin-right:auto}
[dir=rtl] .mk-dots{margin-right:0;margin-left:8px}
[dir=rtl] .mk-tr .a,[dir=rtl] .mk-tr>div:last-child,[dir=rtl] .mk-cl .amt{text-align:left}
[dir=rtl] .mk-arrow svg,[dir=rtl] .mk-row .go,[dir=rtl] .mk-map .ar{transform:scaleX(-1)}
[dir=rtl] .mk-row:hover .go{transform:scaleX(-1) translateX(3px)}
[dir=rtl] .mk-card:hover .mk-arrow,[dir=rtl] .mk-arrow:hover,[dir=rtl] .mk-row:hover{transform:translateX(-4px)}
[dir=rtl] .mk-hb .t i{inset:0 0 0 auto;border-radius:6px 0 0 6px}
[dir=rtl] .mk-pricing .price ul{margin:10px 18px 18px 0}
[dir=rtl] .mk-pricing .matrix td:first-child,[dir=rtl] .mk-pricing .matrix th:first-child,[dir=rtl] .mk-pricing .cmp td:first-child,[dir=rtl] .mk-pricing .cmp th:first-child{text-align:right}
[dir=rtl] .mk-faq p{padding:0 2px 22px 44px}
[dir=rtl] .mk-toast{right:auto;left:18px}
[dir=rtl] .mk-cursor{display:none}
[dir=rtl] .mk-firms:before{right:auto;left:-160px}
[dir=rtl] .mk-track{animation-name:mkmarq-rtl}
@keyframes mkmarq-rtl{to{transform:translateX(50%)}}

/* long words in some languages must not push a card or a heading past its column */
.mk{overflow-wrap:break-word}
.mk h1,.mk h2,.mk h3,.mk h4,.mk-b p,.mk-pricing .price{hyphens:auto;-webkit-hyphens:auto}
.mk-bento>*,.mk-nots>*,.mk-steps>*,.mk-gg>*,.mk-grid2>*,.mk-pricing .plans>*,.mk-pricing .prices>*,.mk-cols>*,.mk-stat>*,.mk-live>*,.mk-firms>*,.mk-faqs>*,.mk-apply>*{min-width:0}

.mk-reply{background:var(--mk-warm);border-radius:14px 14px 14px 4px;padding:12px 14px;font-size:14px;line-height:1.45;max-width:420px;color:var(--mk-ink)}

/* ===== Notion-style theme (27 Nov 2026) =====
   Calm, mostly monochrome layout in the manner of notion.com: near-white canvas, large tight headlines,
   pill buttons, hairline cards, warm-grey panels and one painted brand canvas behind the product.
   ClearlyDue identity kept: logo, navy ink #0B1F3A, teal #0A7F70 accent, copy unchanged. */
.mk{--mk-ink:#0B1F3A;--mk-text:#1F2733;--mk-soft:#5F6670;--mk-warm:#F6F5F4;--mk-warm2:#EEEDEA;--mk-line:#E7E6E3;--mk-r:14px;color:var(--mk-text);font-family:Inter,"SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.mk h1,.mk h2,.mk h3,.mk h4{color:var(--mk-ink)}
.mk h1{font-weight:700;letter-spacing:-.045em;line-height:1.02;font-size:clamp(40px,6.4vw,82px)}
.mk h2{font-weight:700;letter-spacing:-.035em;line-height:1.06;font-size:clamp(30px,4.2vw,52px)}
.mk h3{font-weight:650;letter-spacing:-.02em}
.mk h4{font-weight:650}
.mk-lead{color:var(--mk-soft)}
.mk-eyebrow{font-size:14px;font-weight:600;color:var(--mk-soft);margin-bottom:12px}
.mk-eyebrow:before{content:'';display:inline-block;width:6px;height:6px;border-radius:2px;background:var(--mk-teal);margin:0 8px 2px 0;vertical-align:middle}
.mk-sec{padding-top:clamp(72px,10vw,140px)}

/* pill buttons */
.mk-btn{border-radius:999px;font-weight:600;letter-spacing:-.005em;padding:9px 20px;box-shadow:none}
.mk-btn.lg{padding:12px 24px;border-radius:999px;font-size:16.5px}
.mk-btn.sm{padding:7px 16px;border-radius:999px;font-size:14.5px}
.mk-btn.pri{background:var(--mk-ink);color:#fff;box-shadow:none}
.mk-btn.pri:hover{background:#1A3358}
.mk-btn.sec,.mk-btn.ghost{background:#F1F0EE;color:var(--mk-ink);border-color:transparent}
.mk-btn.sec:hover,.mk-btn.ghost:hover{background:#E8E7E4}
.mk-btn.dark{background:var(--mk-ink)}
.mk-arrow{background:var(--mk-ink)}
.mk-card:hover .mk-arrow,.mk-arrow:hover{background:var(--mk-teal)}

/* top bar: links left, logo centred, actions right */
.mk-top{background:rgba(255,255,255,.92)}
.mk-top.scrolled{box-shadow:none}
.mk-top-in{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;min-height:64px}
.mk-top-l{display:flex;align-items:center;min-width:0}
.mk-top-r{display:flex;align-items:center;justify-content:flex-end;gap:10px;min-width:0}
.mk-top .logo{justify-self:center}
.mk-top .sitenav{gap:2px}
.mk-top .sitenav button,.mk-top .sitenav a{font-weight:500;font-size:15px;color:var(--mk-text);border-radius:8px}
.mk-top .sitenav button:hover,.mk-top .sitenav a:hover{background:var(--mk-warm)}
.mk-top-r select{border-radius:999px;border-color:var(--mk-line)}

/* hero */

  const FEATURES = {
    promises: ['Promises and disputes', 'Promesas y disputas'],
    cash: ['13-week expected cash', 'Caja esperada a 13 semanas'],
    rules: ['Custom follow-up rules and customer settings', 'Reglas de seguimiento a medida y ajustes por cliente'],
    auditcsv: ['Audit log export (CSV)', 'Exportación del registro (CSV)'],
    report: ['Monthly review report', 'Informe de revisión mensual'],
    guided: ['Guided set-up and monthly review call', 'Puesta en marcha guiada y revisión mensual'],
    clients: ['Client workspaces and firm overview', 'Espacios por cliente y vista de despacho']
  };
  const GROWTH = ['promises', 'cash', 'rules', 'auditcsv'];
  const PLANS = {
    starter: { key: 'starter', name: 'Starter', price: 39, maxOpen: 25, maxWs: 1, features: [] },
    growth: { key: 'growth', name: 'Growth', price: 79, maxOpen: 100, maxWs: 1, features: GROWTH },
    assisted: { key: 'assisted', name: 'Assisted', price: 149, maxOpen: 100, maxWs: 1, features: [...GROWTH, 'report', 'guided'] },
    firm: { key: 'firm', name: 'Firm', price: 129, maxOpen: 100, maxWs: 10, features: [...GROWTH, 'clients'] },
